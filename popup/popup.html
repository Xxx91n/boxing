<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Qlearly — Quick Access</title>
  <link rel="stylesheet" href="../ntp/design-system.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup" role="region" aria-label="Qlearly quick access">
    <header class="popup__head">
      <h1 class="popup__title">Recent</h1>
      <p class="popup__subtitle">Your most-used bookmarks</p>
    </header>

    <section class="popup__section">
      <ul id="recent-list" class="popup__list" role="list">
        <!-- Populated by JS -->
      </ul>
    </section>

    <footer class="popup__foot">
      <button id="open-ntp" class="btn btn--primary" aria-label="Open full bookmark dashboard">
        <span aria-hidden="true">→</span>
        Open Dashboard
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
