name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ntp/**'
      - 'background.js'
      - 'manifest.json'
      - 'test/**'
      - '.github/workflows/**'
      - 'scripts/workflow-input-guard.mjs'
  push:
    branches: [main, master]
    paths:
      - 'ntp/**'
      - 'background.js'
      - 'manifest.json'
      - 'test/**'
      - '.github/workflows/**'
      - 'scripts/workflow-input-guard.mjs'

# Ticket 20 (architecture-recovery): repeated pushes supersede each other —
# cancel the stale run instead of queueing it behind the fresh one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  # D2 (ticket 77): contents: read for checkout/npm ci; actions: write is
  # required by actions/upload-artifact (test result upload).
  contents: read
  actions: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Ticket 20: hard ceiling so a hung browser can never queue forever.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.os == 'Linux' && '~/.cache/ms-playwright' || '' }}
            ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '' }}
            ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install firefox chromium

      - name: Install Xvfb (headed browsers on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build extension
        run: node .github/scripts/build.mjs

      - name: Contrast guard
        run: node scripts/contrast-guard.mjs

      - name: Layout bypass guard (ticket 108)
        run: node scripts/layout-bypass-guard.mjs

      - name: Workflow input guard (ticket 76 + 77)
        # Dispatch inputs must never be interpolated into a run: block; remote
        # uses: must be pinned to full commit SHAs; every workflow must declare
        # explicit permissions (never write-all).
        run: node scripts/workflow-input-guard.mjs

      - name: Run tests
        run: xvfb-run --auto-servernum npm test
        if: runner.os == 'Linux'

      - name: Run tests
        run: npm test
        if: runner.os != 'Linux'

      - name: Failure rerun guidance
        if: failure()
        run: |
          echo "::notice::Flaky/environmental failures converge with the native last-failed rerun (ticket 15 method):"
          echo "::notice::npm run test:failed"
          echo "::notice::npm run test:failed -- --project=chromium-extension"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7

  data-golden:
    # Ticket 45 (architecture-recovery) → closed by ticket 54 (2026-09-12):
    # runs only the @data-golden spec (test/tests/boxing-data-golden.spec.ts) in a
    # headless-capable Chromium lane with xvfb. Ticket 54 removed the ticket-45
    # burn-in relaxations: this job is now blocking, and the main-lane
    # exclude-grep env was removed so the gates also fold into the
    # blocking full suite (duplicate coverage kept deliberately — the dedicated
    # lane isolates data-golden failures from unrelated suite noise).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run data golden gates (burn-in)
        run: xvfb-run --auto-servernum npx playwright test --config=test/playwright.config.ts --project=chromium-extension --grep=@data-golden

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-golden-report
          path: |
            playwright-report/
            test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7
