name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ntp/**'
      - 'background.js'
      - 'manifest.json'
      - 'test/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main, master]
    paths:
      - 'ntp/**'
      - 'background.js'
      - 'manifest.json'
      - 'test/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os == 'Linux' && '~/.cache/ms-playwright' || '' }}
            ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '' }}
            ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install firefox chromium

      - name: Build extension
        run: node .github/scripts/build.mjs

      - name: Run tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
