name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ntp/**'
      - 'background.js'
      - 'manifest.json'
      - 'test/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main, master]
    paths:
      - 'ntp/**'
      - 'background.js'
      - 'manifest.json'
      - 'test/**'
      - '.github/workflows/test.yml'

# Ticket 20 (architecture-recovery): repeated pushes supersede each other —
# cancel the stale run instead of queueing it behind the fresh one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Ticket 20: hard ceiling so a hung browser can never queue forever.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os == 'Linux' && '~/.cache/ms-playwright' || '' }}
            ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '' }}
            ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install firefox chromium

      - name: Install Xvfb (headed browsers on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build extension
        run: node .github/scripts/build.mjs

      - name: Run tests
        run: xvfb-run --auto-servernum npm test
        if: runner.os == 'Linux'

      - name: Run tests
        run: npm test
        if: runner.os != 'Linux'

      - name: Failure rerun guidance
        if: failure()
        run: |
          echo "::notice::Flaky/environmental failures converge with the native last-failed rerun (ticket 15 method):"
          echo "::notice::npm run test:failed"
          echo "::notice::npm run test:failed -- --project=chromium-extension"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7
