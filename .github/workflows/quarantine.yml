name: Quarantine Patrol

# Ticket 14 (architecture-recovery): daily patrol of the @quarantine lane.
# Known failures are expected (Firefox environmental, see README "Quarantined
# tests"); continue-on-error keeps the run green so regressions surface as
# annotations instead of a red main lane.

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:17 UTC (10:17 Beijing) — off-peak, not on the hour.
    - cron: '17 2 * * *'

# Ticket 20: a manual dispatch overlapping the daily patrol cancels the older
# run instead of running two headed-browser patrols on one runner. The lane
# itself stays non-blocking (continue-on-error below is unchanged).
concurrency:
  group: quarantine-patrol
  cancel-in-progress: true
permissions:
  # D2 (ticket 77): checkout + setup-node need contents: read; the Playwright
  # cache action needs actions: read.
  contents: read
  actions: read

jobs:
  quarantine:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-quarantine-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-quarantine-

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install firefox chromium

      - name: Install Xvfb (headed browsers)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Ticket 27 (architecture-recovery): the lane converged — zero @quarantine
      # titles remain, so --pass-with-no-tests keeps the step at exit 0 (same as
      # the npm test:quarantine lane) instead of a daily "No tests found" failure.
      - name: Run quarantine lane
        run: xvfb-run --auto-servernum npx playwright test --config=test/playwright.quarantine.config.ts --grep=@quarantine --pass-with-no-tests
