# Boxing — deploy the NTP web demo to GitHub Pages (ticket 07 pages-demo).
# Official artifact flow (upload-pages-artifact + deploy-pages). A gh-pages
# branch source is NOT used: GITHUB_TOKEN pushes do not trigger Pages builds.
# Requires the human one-time switch Settings -> Pages -> Source = GitHub
# Actions (documented in the ticket report; not automated here).
name: Deploy NTP demo (Pages)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "version.json value for a manual run. Empty = release tag, then manifest version."
        required: false
        default: ""

permissions:
  # D2 (ticket 77): Pages deployment needs pages: write + id-token: write
  # (configure/upload/deploy actions); contents: read suffices for checkout.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Checkout main
        if: github.event_name != 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Generate ntp.css (ticket 47, single build entry)
        run: node .github/scripts/build.mjs --css-only
      - name: Assemble demo artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: node .github/scripts/build-demo.mjs --out pages-artifact
      - name: Assert artifact integrity (ntp.css + privacy-policy.html)
        run: |
          test -s pages-artifact/demo/ntp.css
          test -s pages-artifact/privacy-policy.html
      - name: Publish expected version (Pages check)
        id: version
        run: echo "value=$(node -p "require('./pages-artifact/demo/version.json').version")" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      # Ticket 109: a green deploy is not proof that Pages serves the new
      # build. Poll demo/version.json with a cache-buster until it reports the
      # version we just deployed; not converged inside 180s = red.
      - name: Checkout (verify script lives in the repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify Pages freshness (deploy tail, <=180s)
        timeout-minutes: 5
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/pages-gc-verify.mjs --mode=deploy-tail --timeout=180
