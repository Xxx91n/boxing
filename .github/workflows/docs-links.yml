name: Docs links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'GLOSSARY.md'
      - 'docs/**'
      - 'scripts/docs-link-guard.mjs'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main, master]
    paths:
      - 'AGENTS.md'
      - 'GLOSSARY.md'
      - 'docs/**'
      - 'scripts/docs-link-guard.mjs'
      - '.github/workflows/docs-links.yml'

# A stale push should not queue behind itself.
concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Entry-point reference resolvability
        run: node scripts/docs-link-guard.mjs
