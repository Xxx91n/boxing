# Boxing — Build & release packaging workflow.
# Manual dispatch only — does NOT auto-trigger on push/PR.
# Produces 4 release artifacts per run:
#   boxing-chrome-<ver>.zip   -> Chrome build (load unpacked)
#   boxing-chrome-<ver>.crx   -> CRX3 pack (signed when CRX_PRIVATE_KEY_PEM present, else placeholder)
#   boxing-firefox-<ver>.zip  -> Firefox build (zipped folder)
#   boxing-firefox-<ver>.xpi  -> AMO-signed when secrets present and the version
#                                is not already burned on AMO; else unsigned dev XPI
name: Build & Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional build version override (e.g. 3.7.10). Empty keeps manifest version as-is."
        required: false
        default: ""
      make_release:
        description: "Also create a draft GitHub Release attaching the 4 artifacts."
        required: false
        default: "false"
      release_tag:
        description: "Custom release tag name (e.g. v3.7.0-beta). Empty defaults to v<version>."
        required: false
        default: ""
      amo_sign:
        description: "true (default): skip CI AMO signing, leave the version free for a LISTED upload you do manually on AMO. false: CI signs unlisted and PERMANENTLY burns the version number on AMO — only if you intend that."
        required: false
        default: "true"
        type: boolean

permissions:
  # D2 (ticket 77): least privilege for a release workflow — contents: write
  # is required to publish the GitHub Release + artifacts; actions: write is
  # required by the final step to dispatch demo-deploy via workflow_dispatch.
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Every step below is POSIX bash. The windows-latest default shell is
    # pwsh, which hard-failed on bash syntax (run 34010200764, "Get version").
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Copy curated brand icons (icons/ from docs/brand)
        # icons/ in git is committed byte-identical to the curated docs/brand
        # set. Re-copy from docs/brand on every build as a drift guard and to
        # fill non-committed sizes (PNG signature + dimensions asserted).
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const PNG_SIG = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
          fs.mkdirSync("icons", { recursive: true });
          let copied = 0;
          for (const f of fs.readdirSync("docs/brand")) {
            const m = f.match(/^icon_(\d+)\.png$/);
            if (!m) continue;
            const size = Number(m[1]);
            const src = path.join("docs/brand", f);
            const dst = path.join("icons", f);
            fs.copyFileSync(src, dst);
            const srcBuf = fs.readFileSync(src);
            const dstBuf = fs.readFileSync(dst);
            if (!dstBuf.subarray(0, 8).equals(PNG_SIG)) throw new Error(dst + ": not a PNG");
            const w = dstBuf.readUInt32BE(16), h = dstBuf.readUInt32BE(20);
            if (w !== size || h !== size) throw new Error(dst + ": got " + w + "x" + h);
            if (!dstBuf.equals(srcBuf)) throw new Error(dst + ": copy mismatch");
            console.log(dst + " " + w + "x" + h + " " + dstBuf.length + "B OK");
            copied++;
          }
          if (copied === 0) throw new Error("no curated icon_NN.png files under docs/brand");
          for (const need of ["icons/icon_48.png", "icons/icon_128.png"]) {
            if (!fs.existsSync(need)) throw new Error(need + " missing (referenced by manifest.json)");
          }
          JS

      - name: Get version for artifact naming
        id: ver
        # Ticket 76 / spec D1: dispatch input enters via env, never into the
        # shell source. Validate against a strict calver whitelist so a value
        # containing shell metacharacters fails before any command runs.
        # bash [[ =~ ]] matches the whole value (unlike grep's per-line match,
        # which would let an embedded newline through on its first segment).
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="$DISPATCH_VERSION"
          if [ -z "$v" ]; then
            v=$(node -e "console.log(require('./manifest.json').version)")
          elif ! [[ "$v" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid version input: must match ^[0-9]+(\.[0-9]+)*$"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build browser-specific trees + release subdirs
        # Validation runs first (step above), so an invalid dispatch version
        # is rejected before build.mjs consumes the raw input.
        env:
          BOXING_BUILD_VERSION: ${{ github.event.inputs.version }}
        run: node .github/scripts/build.mjs

      - name: Rename artifacts with browser + version prefix
        working-directory: dist
        # Ticket 76: read the already-validated output via env and quote it.
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          # Chrome: dist/boxing-chrome/release/chrome/boxing-<ver>.zip -> boxing-chrome-<ver>.zip
          cp "boxing-chrome/release/chrome/boxing-${VER}.zip" "boxing-chrome-${VER}.zip"
          cp "boxing-chrome/release/chrome/boxing-${VER}.crx" "boxing-chrome-${VER}.crx"
          # Firefox: dist/boxing-firefox/release/firefox/boxing-<ver>.zip -> boxing-firefox-<ver>.zip
          cp "boxing-firefox/release/firefox/boxing-${VER}.zip" "boxing-firefox-${VER}.zip"
          cp "boxing-firefox/release/firefox/boxing-${VER}.xpi" "boxing-firefox-${VER}.xpi"

      - name: Pack CRX3 (signed when CRX_PRIVATE_KEY_PEM secret present)
        # CRX3 packing is deterministic per private key: sign once on ubuntu so
        # the three matrix legs cannot race the same output file name, and so
        # an unsigned re-pack on another leg never overwrites the signed CRX.
        if: matrix.os == 'ubuntu-latest'
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY_PEM }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$CRX_KEY" ]; then
            echo "CRX_PRIVATE_KEY_PEM secret not set -> boxing-chrome.crx stays a placeholder (zip-copy)."
          else
            node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/crx.pem', Buffer.from(process.env.CRX_KEY, 'base64'))"
            npx --yes crx3 pack dist/boxing-chrome/release/chrome/boxing -o "dist/boxing-chrome-${VER}.crx" -p "${RUNNER_TEMP}/crx.pem"
            rm -f "${RUNNER_TEMP}/crx.pem"
            echo "CRX3 signed OK"
          fi

      # ── AMO SIGN SAFETY ──────────────────────────────────────────────
      # DO NOT run web-ext sign locally with real API keys to "test" the
      # pipeline — it uploads to AMO and permanently burns the version
      # number. For local validation use: npx web-ext lint --source-dir ...
      # If you absolutely must verify signing end-to-end locally, use a
      # throwaway version number (e.g. 99.9.x) and delete the version
      # from AMO afterwards. See docs/publishing-guide.md § Local Testing
      # ────────────────────────────────────────────────────────────────
      - name: Sign Firefox XPI (when AMO secrets present)
        # AMO rejects concurrent uploads of the same version (run 34010200764
        # died with "Submission failed (2): Conflict" when all three matrix
        # legs signed 2026.8.21 at once), and a version burned on AMO cannot
        # be re-uploaded. Sign exactly once, on ubuntu, and keep the run green
        # if AMO itself rejects (a signed XPI then comes from a later run).
        if: matrix.os == 'ubuntu-latest' && github.event.inputs.amo_sign != 'true'
        env:
          AMO_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_SECRET: ${{ secrets.AMO_API_SECRET }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$AMO_KEY" ] || [ -z "$AMO_SECRET" ]; then
            echo "AMO_API_KEY/AMO_API_SECRET secrets not set -> boxing-firefox.xpi stays unsigned (dev XPI)."
          else
            rm -f dist/*.xpi
            if npx --yes web-ext sign --api-key "$AMO_KEY" --api-secret "$AMO_SECRET" --source-dir dist/boxing-firefox/release/firefox/boxing --channel unlisted --artifacts-dir dist; then
              SIGNED=$(ls dist/*.xpi 2>/dev/null | head -1)
              if [ -n "$SIGNED" ]; then
                cp "$SIGNED" "dist/boxing-firefox-${VER}.xpi"
                echo "AMO signed XPI OK"
              else
                echo "WARN: web-ext sign reported success but produced no XPI"
              fi
            else
              echo "WARN: AMO signing failed (version conflict or AMO outage) -> keeping unsigned dev XPI; run continues."
            fi
          fi

      - name: Verify all 4 artifacts exist
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          ls -l "dist/boxing-chrome-${VER}.zip" "dist/boxing-chrome-${VER}.crx" "dist/boxing-firefox-${VER}.zip" "dist/boxing-firefox-${VER}.xpi"

      - name: Upload all 4 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # v4 artifact names are global per run: three matrix legs sharing one
          # name collide, so each leg uploads under its own name.
          name: boxing-release-${{ matrix.os }}
          path: |
            dist/boxing-chrome-${{ steps.ver.outputs.version }}.zip
            dist/boxing-chrome-${{ steps.ver.outputs.version }}.crx
            dist/boxing-firefox-${{ steps.ver.outputs.version }}.zip
            dist/boxing-firefox-${{ steps.ver.outputs.version }}.xpi
          if-no-files-found: error

      - name: Build store-facing release pack (source zip + checksums)
        if: matrix.os == 'ubuntu-latest' && github.event.inputs.make_release == 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Source archive for store review (no .git / node_modules / dist)
          git archive --format=zip -o "dist/boxing-source-${VER}.zip" HEAD
          # SHA256 for the public zip set (no .xpi / .crx on GitHub Releases)
          cd dist
          sha256sum \
            "boxing-chrome-${VER}.zip" \
            "boxing-firefox-${VER}.zip" \
            "boxing-source-${VER}.zip" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check bilingual release notes
        if: matrix.os == 'ubuntu-latest' && github.event.inputs.make_release == 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          f="docs/release-notes/${VER}.md"
          test -f "$f" || { echo "::error::missing $f"; exit 1; }
          grep -q '^## English' "$f" || { echo "::error::$f has no '## English' section — bilingual release notes are required"; exit 1; }

      - name: Publish GitHub Release (store zips only)
        if: matrix.os == 'ubuntu-latest' && github.event.inputs.make_release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('v{0}', steps.ver.outputs.version) }}
          name: Boxing ${{ steps.ver.outputs.version }}
          files: |
            dist/boxing-chrome-${{ steps.ver.outputs.version }}.zip
            dist/boxing-firefox-${{ steps.ver.outputs.version }}.zip
            dist/boxing-source-${{ steps.ver.outputs.version }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          # Curated user-facing notes only. Never invent a template body here —
          # that overwrites the published changelog. Require docs/release-notes/<ver>.md.
          body_path: docs/release-notes/${{ steps.ver.outputs.version }}.md

      # GITHUB_TOKEN-created releases do not trigger demo-deploy's `release` event, so dispatch it
      # explicitly. workflow_dispatch is the one event GITHUB_TOKEN may trigger.
      - name: Deploy Pages demo for this release
        if: matrix.os == 'ubuntu-latest' && github.event.inputs.make_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('v{0}', steps.ver.outputs.version) }}
          VER: ${{ steps.ver.outputs.version }}
        run: gh workflow run demo-deploy.yml --ref "$TAG" -f version="$VER"
