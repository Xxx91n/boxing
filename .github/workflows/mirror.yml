name: Mirror to GitLab + Codeberg

on:
  push:
    branches: [main]
  create:
  delete:

permissions:
  # D2 (ticket 77): the mirror job only reads the repo; the two mirror PATs are
  # forwarded via step-level with: and stay visible only inside this job.
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-github-mirror-action@1e93398fcac45b9b9672fd0cf7cb3be2e2dac075
        with:
          gitlab_url: https://gitlab.com/Xxx91n/boxing.git
          gitlab_pat: ${{ secrets.GITLAB_TOKEN }}
          codeberg_url: https://codeberg.org/Xxx91n/boxing.git
          codeberg_pat: ${{ secrets.CODEBERG_PAT }}

