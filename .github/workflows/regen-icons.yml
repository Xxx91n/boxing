# One-shot: regenerate icons/*.png from docs/brand/boxing-prod.png at
# 16/32/48/128/256, commit the results back to this branch, then self-delete
# this workflow file so it never runs again.
name: Regenerate Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-release-pipeline

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate icon set from brand logo
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("docs/brand/boxing-prod.png").convert("RGBA")
          print("source:", src.size)
          for size in (16, 32, 48, 128, 256):
              out = src.resize((size, size), Image.LANCZOS)
              path = f"icons/icon_{size}.png" if size in (48, 128) else f"icons/icon_{size}.png"
              out.save(path, optimize=True)
              print("wrote", path)
          PY

      - name: Verify generated PNGs
        run: |
          python - <<'PY'
          import struct, os
          for size in (16, 32, 48, 128, 256):
              p = f"icons/icon_{size}.png"
              d = open(p, "rb").read()
              assert d[:8] == b"\x89PNG\r\n\x1a\n", f"{p}: not a PNG"
              w, h = struct.unpack(">II", d[16:24])
              assert (w, h) == (size, size), f"{p}: {w}x{h}"
              print(p, f"{w}x{h}", len(d), "bytes OK")
          PY

      - name: Commit regenerated icons
        run: |
          git config user.name "Boxing CI"
          git config user.email "actions@github.com"
          git add icons/
          git commit -m "assets: regenerate icons/ from brand logo (boxing-prod)

          icons/ held an old purple bookmark placeholder that did not match
          the product brand logo. Regenerate 16/32/48/128/256 from
          docs/brand/boxing-prod.png (LANCZOS) so installed builds show the
          real logo in toolbar, extensions page, and store listings."
          git push

      - name: Self-delete this workflow
        run: |
          git rm .github/workflows/regen-icons.yml
          git commit -m "ci: remove one-shot icon regeneration workflow"
          git push
